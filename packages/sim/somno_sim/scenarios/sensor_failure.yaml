scenario: sensor_failure
description: >
  The sEMG electrode detaches four hours in. Everything before that point is a
  clean three-modality recording; everything after it is two-modality. Exercises
  the data-quality path: coverage drops, and the risk engine must fall back to
  insufficient_data rather than scoring a half-instrumented night.
duration_min: 480

sleep:
  stage_ratios: { N1: 0.08, N2: 0.52, N3: 0.15, REM: 0.25 }
  arousal_index: 16

swallow:
  rates_per_hour: { N1: 7.2, N2: 2.0, N3: 0.2, REM: 2.7 }
  rate_sd_per_hour: { N1: 0.7, N2: 0.2, N3: 0.03, REM: 0.5 }
  rate_scale: 6.0
  arousal_coupling_ratio: 0.70
  coordination_distribution: { "E-E": 0.80, "E-I": 0.10, "I-E": 0.07, "I-I": 0.03 }

posture:
  ratios: { supine: 0.40, left: 0.28, right: 0.28, prone: 0.04 }
  turns_per_hour: 1.5
  hob_angle_deg: 15

artifacts:
  electrode_detach: { enabled: true, at_min: 240, intensity: 1.0 }
  sweat_drift: { enabled: true, intensity: 0.6 }
  body_movement: { enabled: true, intensity: 0.4 }
  cardiac: { enabled: true, intensity: 0.25 }
  snoring: { enabled: false }
  speech: { enabled: false }
