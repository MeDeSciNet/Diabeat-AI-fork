scenario: noisy_signal
description: >
  Every confounder on at once - heavy snoring, sleep talking, restless movement,
  strong cardiac coupling, sweat drift. The stress case for artifact gating
  (target F1 >= 0.70).
duration_min: 480

sleep:
  stage_ratios: { N1: 0.14, N2: 0.50, N3: 0.10, REM: 0.22 }
  arousal_index: 32

swallow:
  rates_per_hour: { N1: 7.2, N2: 2.0, N3: 0.2, REM: 2.7 }
  rate_sd_per_hour: { N1: 0.7, N2: 0.2, N3: 0.03, REM: 0.5 }
  rate_scale: 6.0
  arousal_coupling_ratio: 0.75
  coordination_distribution: { "E-E": 0.70, "E-I": 0.15, "I-E": 0.10, "I-I": 0.05 }

resp:
  rate_per_min: 15
  rate_sd_per_min: 2.5

posture:
  ratios: { supine: 0.45, left: 0.25, right: 0.25, prone: 0.05 }
  turns_per_hour: 4.0
  hob_angle_deg: 0

artifacts:
  snoring: { enabled: true, intensity: 1.0 }
  speech: { enabled: true, intensity: 0.8 }
  body_movement: { enabled: true, intensity: 0.9 }
  cardiac: { enabled: true, intensity: 0.7 }
  sweat_drift: { enabled: true, intensity: 0.8 }
  electrode_detach: { enabled: false }

signal:
  acoustic_noise: 0.010
  imu_noise_g: 0.010
  semg_noise_uv: 12.0
