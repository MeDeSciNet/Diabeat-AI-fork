[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "somno-ing"
version = "1.0.0"
description = "SomnoSwallow ingest and analysis service"
requires-python = ">=3.11"
dependencies = [
  "somno-schemas",
  "numpy>=1.26",
  "scipy>=1.11",
  "PyWavelets>=1.5",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "celery>=5.3",
  "redis>=5.0",
  "paho-mqtt>=2.0",
  "boto3>=1.34",
  "pyedflib>=0.1.36",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "somno-sim"]

[project.scripts]
somno-ing = "somno_ing.cli:main"

[tool.setuptools.packages.find]
include = ["somno_ing*"]

[tool.setuptools.package-data]
somno_ing = ["config/*.yaml"]
