# Anonymous access is fine on the compose network - it is not exposed beyond it.
# A deployment would front this with TLS and per-device credentials.
listener 1883
allow_anonymous true
persistence false

# An 8-hour night is roughly 1.4 GB of chunks; the default queue is far too
# small to absorb a consumer restart mid-recording.
max_queued_messages 10000
message_size_limit 10485760
