server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Both apps are client-routed, so unknown paths resolve to the shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|svg)$ {
    expires 1h;
    add_header Cache-Control "public";
  }
}
