# One `docker compose up` brings the whole system online (PRD 3.1).
#
# Service boundaries follow the PRD's five subsystems. SIM is under a profile so
# the stack can also run against a real device on the same MQTT topics without
# a synthetic publisher competing for them.

name: somnoswallow

x-ing-env: &ing-env
  DATABASE_URL: postgresql+psycopg2://somno:somno@postgres:5432/somno
  REDIS_URL: redis://redis:6379/0
  MQTT_URL: mqtt://mosquitto:1883
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: somno
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  API_AUTH_REQUIRED: "true"
  DEV_API_TOKEN: dev-token
  STORE_RAW: "false"
  PAM_BASE_URL: http://pam:8100

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: somno
      POSTGRES_PASSWORD: somno
      POSTGRES_DB: somno
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somno"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  ing-api:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: somno-ing serve --host 0.0.0.0 --port 8000
    environment: *ing-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  ing-consumer:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: somno-ing consume
    environment: *ing-env
    depends_on:
      ing-api: { condition: service_healthy }
      mosquitto: { condition: service_started }

  ing-worker:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: celery -A somno_ing.tasks worker -Q somno --loglevel=info --concurrency=2
    environment: *ing-env
    depends_on:
      ing-api: { condition: service_healthy }

  pam:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    command: somno-pam serve --host 0.0.0.0 --port 8100
    environment:
      <<: *ing-env
      # Demo pacing: the real notice period is 30 s (PAM-S4) and the real
      # minimum spacing is 20 minutes (PAM-S6). Both are overridable so a
      # walkthrough does not need a twenty-minute wait; production leaves them
      # at their defaults.
      PAM_NOTIFY_SECONDS: "${PAM_NOTIFY_SECONDS:-30}"
      PAM_MIN_INTERVAL_S: "${PAM_MIN_INTERVAL_S:-1200}"
    depends_on:
      ing-api: { condition: service_healthy }
    ports:
      - "8100:8100"

  care-web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        APP: care-web
    ports:
      - "5173:80"
    depends_on:
      - ing-api

  station-web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        APP: station-web
    ports:
      - "5174:80"
    depends_on:
      - ing-api

  sim:
    build:
      context: .
      dockerfile: infra/python.Dockerfile
    profiles: ["sim"]
    command: >
      somno-sim run --scenario ${SIM_SCENARIO:-healthy_adult}
      --seed ${SIM_SEED:-42} --speed ${SIM_SPEED:-0}
      --duration-min ${SIM_DURATION_MIN:-120}
      --device-id ${SIM_DEVICE:-dev-001} --subject-code ${SIM_SUBJECT:-SUBJ-001}
      --bed-id ${SIM_BED:-BED-01}
      --mqtt mqtt://mosquitto:1883
    depends_on:
      mosquitto: { condition: service_started }
      ing-consumer: { condition: service_started }

volumes:
  pgdata:
  miniodata:
